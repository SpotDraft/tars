line-length = 100
target-version = "py312"

[lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM", "ARG", "PIE", "RET", "RUF"]
ignore = ["E501", "B008", "B904"]
exclude = [".venv", "__pycache__"]

[lint.isort]
known-first-party = ["app"]

[format]
quote-style = "double"
indent-style = "space"
